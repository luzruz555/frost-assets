<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // 지상 주민 네트워크</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
        }
        
        .hero {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        .hero h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .hero p {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 관리 내역 */
        .admin-logs {
            border: 1px solid #222;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 10px;
            color: #555;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            background: #0d0d0d;
        }
        .admin-logs::-webkit-scrollbar { height: 4px; }
        .admin-logs::-webkit-scrollbar-thumb { background: #333; }
        .log-item { white-space: nowrap; }
        .log-item .action { color: #2dd4bf; }
        .log-item .action.reject { color: #ff6b6b; }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .tab {
            background: transparent;
            border: 1px solid #222;
            color: #555;
            padding: 8px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #444; color: #888; }
        .tab.active { border-color: #D4743C; color: #D4743C; }
        .tab.notice.active { border-color: #FFD700; color: #FFD700; }
        .tab.best.active { border-color: #2dd4bf; color: #2dd4bf; }
        
        .write-btn {
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        .write-btn:hover { background: #e8854a; }
        
        .post-list {
            border: 1px solid #222;
            background: #0d0d0d;
        }
        .post-list-header {
            background: #151515;
            color: #555;
            padding: 10px 15px;
            font-size: 10px;
            border-bottom: 1px solid #222;
        }
        
        .post-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #151515;
            transition: background 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            gap: 12px;
        }
        .post-item:hover { background: #111; }
        .post-item:last-child { border-bottom: none; }
        
        .post-type {
            font-size: 9px;
            padding: 3px 8px;
            border: 1px solid;
            flex-shrink: 0;
            min-width: 45px;
            text-align: center;
        }
        .post-type.free { color: #666; border-color: #333; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #c084fc; border-color: #c084fc; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; }
        .post-type.best { color: #2dd4bf; border-color: #2dd4bf; }
        
        .post-info { flex: 1; min-width: 0; }
        .post-title {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .post-title .comment-count { color: #D4743C; font-size: 11px; margin-left: 5px; }
        .post-title .like-count { color: #2dd4bf; font-size: 11px; margin-left: 5px; }
        .post-meta {
            font-size: 10px;
            color: #444;
            margin-top: 4px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .page-btn {
            background: transparent;
            border: 1px solid #222;
            color: #555;
            padding: 8px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
        }
        .page-btn:hover { border-color: #444; color: #888; }
        .page-btn.active { border-color: #D4743C; color: #D4743C; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #333;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #444;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .blink { animation: blink 1s infinite; }
        
        .footer {
            text-align: center;
            padding: 30px;
            font-size: 10px;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>FROST_COMMUNITY</h1>
        <p>Surface Citizen Network v2.1.7 // 2076</p>
    </div>
    
    <div class="container">
        <!-- 관리 내역 -->
        <div class="admin-logs" id="adminLogs">
            <span style="color:#333;">최근 관리:</span>
        </div>
        
        <div class="toolbar">
            <div class="tabs">
                <button class="tab active" data-type="">전체</button>
                <button class="tab notice" data-type="notice">공지</button>
                <button class="tab best" data-type="best">개념글</button>
                <button class="tab" data-type="free">자유</button>
                <button class="tab" data-type="info">정보</button>
                <button class="tab" data-type="trade">거래</button>
                <button class="tab" data-type="help">질문</button>
            </div>
            <a href="write.html" class="write-btn">WRITE</a>
        </div>
        
        <div class="post-list">
            <div class="post-list-header">
                POST_LIST // <span id="totalCount">0</span> entries
            </div>
            <div id="postListBody">
                <div class="loading">LOADING<span class="blink">_</span></div>
            </div>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>
    
    <div class="footer">
        FROST_COMMUNITY // Since 2071
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        
        let currentPage = 1;
        let currentType = '';
        let totalPages = 1;
        
        // 관리 내역 로드
        async function loadAdminLogs() {
            try {
                const response = await fetch(`${API_URL}/api/admin/logs`, {
                    headers: { 'X-Admin-Key': 'luzruz555' }
                });
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    const logsHtml = data.logs.slice(0, 10).map(log => {
                        const actionLabels = {
                            'approve': '승인',
                            'reject': '거절', 
                            'delete': '삭제',
                            'write': '작성',
                            'edit': '수정'
                        };
                        const isNegative = ['reject', 'delete', 'delete_comment', 'delete_reply'].includes(log.action);
                        return `<span class="log-item"><span class="action ${isNegative ? 'reject' : ''}">${actionLabels[log.action] || log.action}</span> ${log.post_title ? '"' + log.post_title.substring(0, 10) + '"' : ''}</span>`;
                    }).join('');
                    
                    document.getElementById('adminLogs').innerHTML = `<span style="color:#333;">최근:</span>${logsHtml}`;
                }
            } catch (e) {}
        }
        
        // 탭 이벤트
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
                currentPage = 1;
                loadPosts();
            });
        });
        
        // 글 목록 로드
        async function loadPosts() {
            const listBody = document.getElementById('postListBody');
            listBody.innerHTML = '<div class="loading">LOADING<span class="blink">_</span></div>';
            
            try {
                let url = `${API_URL}/api/posts?page=${currentPage}&limit=15`;
                
                if (currentType === 'notice') {
                    url += '&noticeOnly=true';
                } else if (currentType === 'best') {
                    url += '&bestOnly=true';
                } else if (currentType) {
                    url += `&type=${currentType}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('totalCount').textContent = data.total + (data.notices || 0);
                totalPages = data.totalPages || 1;
                
                if (data.posts.length === 0) {
                    listBody.innerHTML = '<div class="empty-state">게시글이 없습니다.</div>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }
                
                listBody.innerHTML = data.posts.map(post => {
                    const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
                    let displayType, typeClass;
                    
                    if (post.isNotice) {
                        displayType = '공지';
                        typeClass = 'notice';
                    } else if (post.likes >= 10) {
                        displayType = '개념';
                        typeClass = 'best';
                    } else {
                        displayType = typeLabel[post.type] || post.type;
                        typeClass = post.type;
                    }
                    
                    return `
                        <a href="post.html?id=${post.id}" class="post-item">
                            <span class="post-type ${typeClass}">${displayType}</span>
                            <div class="post-info">
                                <div class="post-title">
                                    ${escapeHtml(post.title)}
                                    ${post.commentCount > 0 ? `<span class="comment-count">[${post.commentCount}]</span>` : ''}
                                    ${post.likes > 0 ? `<span class="like-count">♥${post.likes}</span>` : ''}
                                </div>
                                <div class="post-meta">
                                    ${formatAuthor(post.author)} · ${formatDate(post.createdAt)}
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
                
                renderPagination();
                
            } catch (error) {
                listBody.innerHTML = `<div class="empty-state">오류: ${error.message}</div>`;
            }
        }
        
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>`;
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>`;
            pagination.innerHTML = html;
        }
        
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadPosts();
            window.scrollTo(0, 0);
        }
        
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const now = new Date();
            const diff = now - d;
            
            if (diff < 60000) return '방금';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}분 전`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}시간 전`;
            
            return `2076.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatAuthor(author) {
            if (author === '겁많은두더지') {
                return '<span style="background:#D4743C;color:#0a0a0a;padding:1px 4px;font-size:8px;margin-right:3px;">ADMIN</span>' + escapeHtml(author);
            }
            return escapeHtml(author);
        }
        
        loadAdminLogs();
        loadPosts();
    </script>
</body>
</html>
