<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // ADMIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            border: 2px solid #ff4444;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(255, 68, 68, 0.05);
        }
        
        .header h1 {
            font-size: 14px;
            font-weight: 500;
            color: #ff4444;
        }
        
        .header .path {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* 로그인 폼 */
        .login-box {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
        }
        
        .login-box h2 {
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .login-box input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 15px;
            outline: none;
        }
        
        .login-box input:focus {
            border-color: #D4743C;
        }
        
        .login-box button {
            width: 100%;
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
        }
        
        .login-box button:hover {
            background: #e8854a;
        }
        
        /* 관리자 패널 */
        .admin-panel {
            display: none;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .terminal {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            margin-bottom: 20px;
        }
        
        .terminal-header {
            background: #D4743C;
            color: #0a0a0a;
            padding: 8px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        
        .terminal-body {
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .post-item {
            display: grid;
            grid-template-columns: 60px 1fr 100px 80px;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #222;
            align-items: center;
        }
        
        .post-item:hover {
            background: rgba(212, 116, 60, 0.05);
        }
        
        .post-type {
            font-size: 10px;
            padding: 2px 6px;
            border: 1px solid;
            text-align: center;
        }
        
        .post-type.free { color: #888; border-color: #888; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #f472b6; border-color: #f472b6; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; }
        
        .post-title {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        
        .post-title:hover {
            color: #D4743C;
        }
        
        .post-author {
            font-size: 11px;
            color: #666;
        }
        
        .btn-delete {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-delete:hover {
            background: #ff4444;
            color: #0a0a0a;
        }
        
        .btn-edit {
            background: transparent;
            border: 1px solid #60a5fa;
            color: #60a5fa;
            padding: 5px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            margin-right: 5px;
        }
        
        .btn-edit:hover {
            background: #60a5fa;
            color: #0a0a0a;
        }
        
        /* 글 상세 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            padding: 20px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .modal-header h3 {
            font-size: 14px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #D4743C;
            font-size: 20px;
            cursor: pointer;
        }
        
        .post-detail-content {
            background: #1a1a1a;
            padding: 15px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }
        
        .comment-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            border-bottom: 1px solid #222;
        }
        
        .comment-info {
            flex: 1;
        }
        
        .comment-meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .comment-meta .author {
            color: #D4743C;
        }
        
        .comment-text {
            font-size: 12px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        .logout-btn {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 15px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .logout-btn:hover {
            background: #ff4444;
            color: #0a0a0a;
        }
        
        .refresh-btn {
            background: transparent;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 8px 15px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .refresh-btn:hover {
            background: #4ade80;
            color: #0a0a0a;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            border: 1px solid #333;
            padding: 15px 20px;
            background: #0d0d0d;
        }

        .stat-box .label {
            font-size: 11px;
            color: #666;
        }

        .stat-box .value {
            font-size: 24px;
            color: #D4743C;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚠️ FROST_COMMUNITY // ADMIN_CONSOLE</h1>
            <div class="path">C:\FROST\ADMIN\</div>
        </div>
        
        <!-- 로그인 -->
        <div class="login-box" id="loginBox">
            <h2>[ ADMIN_AUTH ]</h2>
            <input type="password" id="adminPassword" placeholder="관리자 비밀번호" onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">[ ACCESS ]</button>
        </div>
        
        <!-- 관리자 패널 -->
        <div class="admin-panel" id="adminPanel">
            <button class="logout-btn" onclick="logout()">[ LOGOUT ]</button>
            <button class="refresh-btn" onclick="loadPosts()">[ REFRESH ]</button>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="label">TOTAL_POSTS</div>
                    <div class="value" id="totalPosts">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">NOTICES</div>
                    <div class="value" id="totalNotices">0</div>
                </div>
            </div>
            
            <div class="terminal">
                <div class="terminal-header">
                    <span>POST_MANAGER.exe</span>
                    <span id="postCount">[0 ENTRIES]</span>
                </div>
                <div class="terminal-body" id="postList">
                    <div class="loading">LOADING<span class="blink">_</span></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 글 상세 모달 -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">글 상세</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="post-detail-content" id="modalContent"></div>
            <div id="modalComments"></div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const ADMIN_PASSWORD = 'luzruz555';
        
        let isLoggedIn = false;
        let allPosts = [];
        
        // 로그인
        function login() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadPosts();
            } else {
                alert('ACCESS DENIED');
            }
        }
        
        function logout() {
            isLoggedIn = false;
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminPassword').value = '';
        }
        
        // 글 목록 로드
        async function loadPosts() {
            if (!isLoggedIn) return;
            
            const postList = document.getElementById('postList');
            postList.innerHTML = '<div class="loading">LOADING<span class="blink">_</span></div>';
            
            try {
                const response = await fetch(`${API_URL}/api/posts?limit=100`);
                const data = await response.json();
                
                allPosts = data.posts;
                
                document.getElementById('totalPosts').textContent = data.total + data.notices;
                document.getElementById('totalNotices').textContent = data.notices;
                document.getElementById('postCount').textContent = `[${data.posts.length} ENTRIES]`;
                
                if (data.posts.length === 0) {
                    postList.innerHTML = '<div class="loading">NO_POSTS_FOUND</div>';
                    return;
                }
                
                const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
                
                postList.innerHTML = data.posts.map(post => {
                    const displayType = post.isNotice ? '공지' : (typeLabel[post.type] || post.type);
                    const typeClass = post.isNotice ? 'notice' : post.type;
                    return `
                        <div class="post-item">
                            <span class="post-type ${typeClass}">${displayType}</span>
                            <span class="post-title" onclick="viewPost('${post.id}')">${escapeHtml(post.title)}</span>
                            <span class="post-author">${escapeHtml(post.author)}</span>
                            <div>
                                <button class="btn-delete" onclick="deletePost('${post.id}')">삭제</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error:', error);
                postList.innerHTML = '<div class="loading">ERROR: 데이터를 불러올 수 없습니다.</div>';
            }
        }
        
        // 글 상세 보기
        async function viewPost(postId) {
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`);
                const post = await response.json();
                
                document.getElementById('modalTitle').textContent = post.title;
                document.getElementById('modalContent').textContent = post.content;
                
                // 댓글 표시
                const commentsHtml = (post.comments && post.comments.length > 0) 
                    ? `<h4 style="margin: 15px 0 10px; font-size: 12px;">COMMENTS [${post.comments.length}]</h4>` +
                      post.comments.map((c, i) => `
                        <div class="comment-item-admin">
                            <div class="comment-info">
                                <div class="comment-meta">
                                    <span class="author">${escapeHtml(c.author)}</span>
                                    <span>${formatDate(c.createdAt)}</span>
                                </div>
                                <div class="comment-text">${escapeHtml(c.content)}</div>
                            </div>
                            <button class="btn-delete" onclick="deleteComment('${postId}', ${i})">삭제</button>
                        </div>
                      `).join('')
                    : '<p style="color: #666; font-size: 12px;">댓글 없음</p>';
                
                document.getElementById('modalComments').innerHTML = commentsHtml;
                document.getElementById('postModal').classList.add('active');
                
            } catch (error) {
                console.error('Error:', error);
                alert('글을 불러올 수 없습니다.');
            }
        }
        
        function closeModal() {
            document.getElementById('postModal').classList.remove('active');
        }
        
        // 글 삭제 (관리자)
        async function deletePost(postId) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Admin-Key': ADMIN_PASSWORD
                    }
                });
                
                if (response.ok) {
                    alert('삭제되었습니다.');
                    loadPosts();
                    closeModal();
                } else {
                    const err = await response.json();
                    alert(err.error || '삭제 실패');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결 실패');
            }
        }
        
        // 댓글 삭제 (관리자)
        async function deleteComment(postId, commentIndex) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts/${postId}/comments/${commentIndex}`, {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Admin-Key': ADMIN_PASSWORD
                    }
                });
                
                if (response.ok) {
                    alert('댓글이 삭제되었습니다.');
                    viewPost(postId); // 새로고침
                } else {
                    const err = await response.json();
                    alert(err.error || '삭제 실패');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결 실패');
            }
        }
        
        // 유틸리티
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `2076.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ESC로 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
