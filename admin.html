<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // ADMIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            border: 2px solid #ff4444;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(255, 68, 68, 0.1);
        }
        .header h1 { font-size: 14px; font-weight: 500; color: #ff4444; }
        
        .login-form {
            border: 2px solid #333;
            padding: 30px;
            max-width: 400px;
            margin: 100px auto;
        }
        .login-form h2 { font-size: 14px; margin-bottom: 20px; text-align: center; }
        .login-form input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 15px;
            outline: none;
        }
        .login-form button {
            width: 100%;
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
        }
        
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        /* 탭 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        .tab-btn.active { border-color: #D4743C; color: #D4743C; background: rgba(212, 116, 60, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 관리 내역 */
        .admin-logs {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
        }
        .admin-logs h3 { font-size: 12px; margin-bottom: 10px; color: #888; }
        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid #1a1a1a;
            color: #666;
        }
        .log-item .action { color: #4ade80; }
        .log-item .action.reject { color: #ff4444; }
        .log-item .time { color: #444; }
        
        /* 글 작성 폼 */
        .write-form {
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
        }
        .write-form h3 { font-size: 14px; margin-bottom: 15px; }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .write-form select, .write-form input, .write-form textarea {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            outline: none;
        }
        .write-form select { width: 120px; }
        .write-form input { flex: 1; }
        .write-form textarea {
            width: 100%;
            height: 150px;
            resize: none;
            color: #ccc;
        }
        .write-form label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
        }
        .write-form button {
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* 글 목록 */
        .post-item {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            background: #0d0d0d;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .post-info { flex: 1; }
        .post-title { color: #ccc; font-size: 14px; margin-bottom: 5px; }
        .post-meta { font-size: 11px; color: #666; }
        .post-type { font-size: 10px; padding: 2px 6px; border: 1px solid; margin-right: 10px; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; }
        .post-type.free { color: #888; border-color: #888; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #f472b6; border-color: #f472b6; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 5px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
        }
        .btn:hover { border-color: #D4743C; color: #D4743C; }
        .btn.danger { border-color: #ff4444; color: #ff4444; }
        .btn.danger:hover { background: #ff4444; color: #0a0a0a; }
        .btn.primary { border-color: #60a5fa; color: #60a5fa; }
        .btn.primary:hover { background: #60a5fa; color: #0a0a0a; }
        
        .comments-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #222;
        }
        .comment-item {
            padding: 8px;
            background: #111;
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .comment-content { flex: 1; }
        .comment-author { color: #D4743C; }
        .reply-item {
            margin-left: 20px;
            padding: 6px 8px;
            background: #151515;
            border-left: 2px solid #333;
        }
        .reply-item .comment-author { color: #60a5fa; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
        }
        .stat-box .number { font-size: 24px; color: #D4743C; }
        .stat-box .label { font-size: 10px; color: #666; margin-top: 5px; }
        
        .loading { text-align: center; padding: 30px; color: #666; }
        
        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 { font-size: 14px; margin-bottom: 15px; }
        .modal-content select, .modal-content input, .modal-content textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
            outline: none;
        }
        .modal-content textarea {
            color: #ccc;
            height: 200px;
            resize: none;
        }
        .modal-content label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #D4743C;
            background: transparent;
            color: #D4743C;
        }
        .modal-buttons button.primary { background: #60a5fa; border-color: #60a5fa; color: #0a0a0a; }
        .modal-buttons button.danger { background: #ff4444; border-color: #ff4444; color: #0a0a0a; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인 폼 -->
        <div class="login-form" id="loginForm">
            <h2>ADMIN LOGIN</h2>
            <input type="text" id="adminUser" placeholder="관리자 ID">
            <input type="password" id="adminPass" placeholder="비밀번호">
            <button onclick="login()">LOGIN</button>
        </div>
        
        <!-- 관리자 패널 -->
        <div class="admin-panel" id="adminPanel">
            <div class="header">
                <h1>⚠️ FROST_COMMUNITY // ADMIN PANEL</h1>
            </div>
            
            <!-- 관리 내역 -->
            <div class="admin-logs" id="adminLogs">
                <h3>📋 최근 관리 내역</h3>
                <div id="logsList">로딩 중...</div>
            </div>
            
            <!-- 통계 -->
            <div class="stats" id="stats">
                <div class="stat-box">
                    <div class="number" id="totalPosts">-</div>
                    <div class="label">총 글</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalComments">-</div>
                    <div class="label">총 댓글</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalNotices">-</div>
                    <div class="label">공지</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalBest">-</div>
                    <div class="label">개념글</div>
                </div>
            </div>
            
            <!-- 탭 -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('write')">글 작성</button>
                <button class="tab-btn" onclick="switchTab('posts')">글 관리</button>
            </div>
            
            <!-- 글 작성 탭 -->
            <div class="tab-content active" id="tab-write">
                <div class="write-form">
                    <h3>📝 관리자 글 작성</h3>
                    <div class="form-row">
                        <select id="writeType">
                            <option value="free">자유</option>
                            <option value="info">정보</option>
                            <option value="trade">거래</option>
                            <option value="help">질문</option>
                        </select>
                        <input type="text" id="writeTitle" placeholder="제목" maxlength="50">
                    </div>
                    <textarea id="writeContent" placeholder="내용을 입력하세요...&#10;&#10;마크다운 지원:&#10;# 큰글씨&#10;*기울임*&#10;```코드블럭```&#10;![이미지](URL)"></textarea>
                    <label>
                        <input type="checkbox" id="writeNotice">
                        공지로 등록
                    </label>
                    <button onclick="submitAdminPost()">글 작성</button>
                </div>
            </div>
            
            <!-- 글 관리 탭 -->
            <div class="tab-content" id="tab-posts">
                <div id="postsList">
                    <div class="loading">로딩 중...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 글 수정 모달 -->
    <div class="modal" id="editPostModal">
        <div class="modal-content">
            <h3>글 수정</h3>
            <select id="editPostType">
                <option value="free">자유</option>
                <option value="info">정보</option>
                <option value="trade">거래</option>
                <option value="help">질문</option>
            </select>
            <input type="text" id="editPostTitle" placeholder="제목">
            <textarea id="editPostContent" placeholder="내용"></textarea>
            <label>
                <input type="checkbox" id="editPostNotice">
                공지로 등록
            </label>
            <div class="modal-buttons">
                <button onclick="closeModal('editPostModal')">취소</button>
                <button class="primary" onclick="savePostEdit()">저장</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const ADMIN_USER = '겁많은두더지';
        const ADMIN_PASS = 'luzruz555';
        
        let adminKey = '';
        let currentEditPostId = null;
        let allPosts = [];
        
        function login() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                adminKey = pass;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadAdminLogs();
                loadAllPosts();
            } else {
                alert('로그인 실패');
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }
        
        // 관리 내역 로드
        async function loadAdminLogs() {
            try {
                const response = await fetch(`${API_URL}/api/admin/logs`, {
                    headers: { 'X-Admin-Key': adminKey }
                });
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    document.getElementById('logsList').innerHTML = data.logs.slice(0, 20).map(log => `
                        <div class="log-item">
                            <span class="action ${log.action === 'reject' ? 'reject' : ''}">[${log.action.toUpperCase()}]</span>
                            ${log.post_title ? `"${escapeHtml(log.post_title.substring(0, 20))}"` : ''}
                            <span class="time">${formatTime(log.created_at)}</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('logsList').innerHTML = '<div style="color:#444">관리 내역이 없습니다.</div>';
                }
            } catch (error) {
                document.getElementById('logsList').innerHTML = '<div style="color:#ff4444">로드 실패</div>';
            }
        }
        
        // 관리 로그 추가
        async function addAdminLog(action, postId, postTitle) {
            try {
                await fetch(`${API_URL}/api/admin/logs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({
                        action,
                        postId,
                        postTitle,
                        adminName: ADMIN_USER
                    })
                });
                loadAdminLogs();
            } catch (e) {}
        }
        
        // 글 목록 로드
        async function loadAllPosts() {
            try {
                const response = await fetch(`${API_URL}/api/posts?limit=50`);
                const data = await response.json();
                allPosts = data.posts;
                
                document.getElementById('totalPosts').textContent = data.total + data.notices;
                document.getElementById('totalNotices').textContent = data.notices;
                
                // 개념글 수
                const bestCount = allPosts.filter(p => p.likes >= 10).length;
                document.getElementById('totalBest').textContent = bestCount;
                
                let totalComments = 0;
                const postsHtml = [];
                
                for (const post of allPosts) {
                    const detailRes = await fetch(`${API_URL}/api/posts/${post.id}`);
                    const detail = await detailRes.json();
                    
                    const commentCount = countAllComments(detail.comments || []);
                    totalComments += commentCount;
                    
                    postsHtml.push(renderPost(detail));
                }
                
                document.getElementById('totalComments').textContent = totalComments;
                document.getElementById('postsList').innerHTML = postsHtml.join('') || '<div class="loading">글이 없습니다.</div>';
                
            } catch (error) {
                document.getElementById('postsList').innerHTML = `<div class="loading">오류: ${error.message}</div>`;
            }
        }
        
        function countAllComments(comments) {
            return comments.reduce((sum, c) => sum + 1 + (c.replies?.length || 0), 0);
        }
        
        function renderPost(post) {
            const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
            const displayType = post.isNotice ? '공지' : typeLabel[post.type];
            const typeClass = post.isNotice ? 'notice' : post.type;
            
            let commentsHtml = '';
            if (post.comments && post.comments.length > 0) {
                commentsHtml = `
                    <div class="comments-list">
                        ${post.comments.map(c => `
                            <div class="comment-item">
                                <div class="comment-content">
                                    <span class="comment-author">${escapeHtml(c.author)}</span>: 
                                    ${escapeHtml(c.content.substring(0, 50))}${c.content.length > 50 ? '...' : ''}
                                </div>
                                <button class="btn danger" onclick="deleteComment('${c.id}')">삭제</button>
                            </div>
                            ${c.replies && c.replies.length > 0 ? c.replies.map(r => `
                                <div class="comment-item reply-item">
                                    <div class="comment-content">
                                        <span class="comment-author">↳ ${escapeHtml(r.author)}</span>: 
                                        ${escapeHtml(r.content.substring(0, 50))}
                                    </div>
                                    <button class="btn danger" onclick="deleteReply('${r.id}')">삭제</button>
                                </div>
                            `).join('') : ''}
                        `).join('')}
                    </div>
                `;
            }
            
            return `
                <div class="post-item" data-id="${post.id}">
                    <div class="post-header">
                        <div class="post-info">
                            <div>
                                <span class="post-type ${typeClass}">${displayType}</span>
                                ${post.likes >= 10 ? '<span class="post-type" style="color:#f472b6;border-color:#f472b6;">개념</span>' : ''}
                            </div>
                            <div class="post-title">${escapeHtml(post.title)}</div>
                            <div class="post-meta">
                                ${escapeHtml(post.author)} | ${formatDate(post.createdAt)} | 
                                ♥ ${post.likes || 0} | 💬 ${countAllComments(post.comments || [])}
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn" onclick="location.href='post.html?id=${post.id}'">보기</button>
                            <button class="btn primary" onclick="showEditPostModal('${post.id}')">수정</button>
                            <button class="btn danger" onclick="deletePost('${post.id}')">삭제</button>
                        </div>
                    </div>
                    ${commentsHtml}
                </div>
            `;
        }
        
        // 관리자 글 작성
        async function submitAdminPost() {
            const type = document.getElementById('writeType').value;
            const title = document.getElementById('writeTitle').value.trim();
            const content = document.getElementById('writeContent').value.trim();
            const isNotice = document.getElementById('writeNotice').checked;
            
            if (!title || !content) {
                alert('제목과 내용을 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({ type, title, content, isNotice })
                });
                
                if (response.ok) {
                    alert('글이 작성되었습니다.');
                    document.getElementById('writeTitle').value = '';
                    document.getElementById('writeContent').value = '';
                    document.getElementById('writeNotice').checked = false;
                    addAdminLog('write', null, title);
                    loadAllPosts();
                } else {
                    const err = await response.json();
                    alert(err.error || '작성 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 글 수정 모달
        async function showEditPostModal(postId) {
            currentEditPostId = postId;
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`);
                const post = await response.json();
                
                document.getElementById('editPostType').value = post.type;
                document.getElementById('editPostTitle').value = post.title;
                document.getElementById('editPostContent').value = post.content;
                document.getElementById('editPostNotice').checked = post.isNotice;
                
                document.getElementById('editPostModal').classList.add('active');
            } catch (error) {
                alert('글 로드 실패');
            }
        }
        
        // 글 수정 저장
        async function savePostEdit() {
            const type = document.getElementById('editPostType').value;
            const title = document.getElementById('editPostTitle').value.trim();
            const content = document.getElementById('editPostContent').value.trim();
            const isNotice = document.getElementById('editPostNotice').checked;
            
            if (!title || !content) {
                alert('제목과 내용을 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts/${currentEditPostId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({ type, title, content, isNotice })
                });
                
                if (response.ok) {
                    alert('수정되었습니다.');
                    closeModal('editPostModal');
                    addAdminLog('edit', currentEditPostId, title);
                    loadAllPosts();
                } else {
                    alert('수정 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 글 삭제
        async function deletePost(postId) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            const post = allPosts.find(p => p.id === postId);
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    addAdminLog('delete', postId, post?.title);
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        // 댓글 삭제
        async function deleteComment(commentId) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/comments/${commentId}?type=comment`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    addAdminLog('delete_comment', null, null);
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        // 대댓글 삭제
        async function deleteReply(replyId) {
            if (!confirm('답글을 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/comments/${replyId}?type=reply`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    addAdminLog('delete_reply', null, null);
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function formatTime(timestamp) {
            const d = new Date(timestamp);
            return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal('editPostModal');
        });
    </script>
</body>
</html>
