<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // ADMIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            border: 2px solid #ff4444;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(255, 68, 68, 0.1);
        }
        .header h1 { font-size: 14px; font-weight: 500; color: #ff4444; }
        
        .login-form {
            border: 2px solid #333;
            padding: 30px;
            max-width: 400px;
            margin: 100px auto;
        }
        .login-form h2 { font-size: 14px; margin-bottom: 20px; text-align: center; }
        .login-form input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 15px;
            outline: none;
        }
        .login-form button {
            width: 100%;
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
        }
        
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        .post-item {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            background: #0d0d0d;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .post-title { color: #ccc; font-size: 14px; }
        .post-meta { font-size: 11px; color: #666; }
        .post-type { font-size: 10px; padding: 2px 6px; border: 1px solid; margin-right: 10px; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; }
        
        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 5px 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            margin-left: 5px;
        }
        .btn:hover { border-color: #D4743C; color: #D4743C; }
        .btn.danger { border-color: #ff4444; color: #ff4444; }
        .btn.danger:hover { background: #ff4444; color: #0a0a0a; }
        
        .comments-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #222;
        }
        .comment-item {
            padding: 8px;
            background: #111;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .comment-author { color: #D4743C; }
        .reply-item {
            margin-left: 20px;
            padding: 6px 8px;
            background: #151515;
            border-left: 2px solid #333;
        }
        .reply-item .comment-author { color: #60a5fa; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
        }
        .stat-box .number { font-size: 24px; color: #D4743C; }
        .stat-box .label { font-size: 11px; color: #666; margin-top: 5px; }
        
        .loading { text-align: center; padding: 30px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인 폼 -->
        <div class="login-form" id="loginForm">
            <h2>ADMIN LOGIN</h2>
            <input type="text" id="adminUser" placeholder="관리자 ID">
            <input type="password" id="adminPass" placeholder="비밀번호">
            <button onclick="login()">LOGIN</button>
        </div>
        
        <!-- 관리자 패널 -->
        <div class="admin-panel" id="adminPanel">
            <div class="header">
                <h1>⚠️ FROST_COMMUNITY // ADMIN PANEL</h1>
            </div>
            
            <div class="stats" id="stats">
                <div class="stat-box">
                    <div class="number" id="totalPosts">-</div>
                    <div class="label">총 글 수</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalComments">-</div>
                    <div class="label">총 댓글 수</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalNotices">-</div>
                    <div class="label">공지 수</div>
                </div>
            </div>
            
            <div id="postsList">
                <div class="loading">로딩 중...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const ADMIN_USER = '겁많은두더지';
        const ADMIN_PASS = 'luzruz555';
        
        let adminKey = '';
        
        function login() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                adminKey = pass;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadAllPosts();
            } else {
                alert('로그인 실패');
            }
        }
        
        async function loadAllPosts() {
            try {
                const response = await fetch(`${API_URL}/api/posts?limit=100`);
                const data = await response.json();
                
                document.getElementById('totalPosts').textContent = data.total + data.notices;
                document.getElementById('totalNotices').textContent = data.notices;
                
                let totalComments = 0;
                const postsHtml = [];
                
                for (const post of data.posts) {
                    // 각 글의 상세 정보 가져오기
                    const detailRes = await fetch(`${API_URL}/api/posts/${post.id}`);
                    const detail = await detailRes.json();
                    
                    const commentCount = countAllComments(detail.comments || []);
                    totalComments += commentCount;
                    
                    postsHtml.push(renderPost(detail));
                }
                
                document.getElementById('totalComments').textContent = totalComments;
                document.getElementById('postsList').innerHTML = postsHtml.join('');
                
            } catch (error) {
                document.getElementById('postsList').innerHTML = `<div class="loading">오류: ${error.message}</div>`;
            }
        }
        
        function countAllComments(comments) {
            return comments.reduce((sum, c) => sum + 1 + (c.replies?.length || 0), 0);
        }
        
        function renderPost(post) {
            const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
            const displayType = post.isNotice ? '공지' : typeLabel[post.type];
            
            let commentsHtml = '';
            if (post.comments && post.comments.length > 0) {
                commentsHtml = `
                    <div class="comments-list">
                        ${post.comments.map(c => `
                            <div class="comment-item">
                                <span class="comment-author">${escapeHtml(c.author)}</span>: 
                                ${escapeHtml(c.content.substring(0, 50))}${c.content.length > 50 ? '...' : ''}
                                <button class="btn danger" onclick="deleteComment('${c.id}')">삭제</button>
                                ${c.replies && c.replies.length > 0 ? c.replies.map(r => `
                                    <div class="reply-item">
                                        <span class="comment-author">↳ ${escapeHtml(r.author)}</span>: 
                                        ${escapeHtml(r.content.substring(0, 50))}
                                        <button class="btn danger" onclick="deleteReply('${r.id}')">삭제</button>
                                    </div>
                                `).join('') : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            return `
                <div class="post-item">
                    <div class="post-header">
                        <div>
                            <span class="post-type ${post.isNotice ? 'notice' : ''}">${displayType}</span>
                            <span class="post-title">${escapeHtml(post.title)}</span>
                        </div>
                        <div>
                            <span class="post-meta">${escapeHtml(post.author)} | ${formatDate(post.createdAt)}</span>
                            <button class="btn" onclick="location.href='post.html?id=${post.id}'">보기</button>
                            <button class="btn danger" onclick="deletePost('${post.id}')">삭제</button>
                        </div>
                    </div>
                    ${commentsHtml}
                </div>
            `;
        }
        
        async function deletePost(postId) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        async function deleteComment(commentId) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/comments/${commentId}?type=comment`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        async function deleteReply(replyId) {
            if (!confirm('답글을 삭제하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/admin/comments/${replyId}?type=reply`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey }
                });
                
                if (response.ok) {
                    alert('삭제됨');
                    loadAllPosts();
                } else {
                    alert('삭제 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }
        
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
