<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // 글 보기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 16px; font-weight: 500; }
        
        .back-btn {
            display: inline-block;
            color: #555;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #222;
            font-size: 11px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: #444; color: #888; }
        
        .post-card {
            border: 1px solid #222;
            background: #0d0d0d;
            margin-bottom: 20px;
        }
        .post-header {
            padding: 15px;
            border-bottom: 1px solid #1a1a1a;
        }
        .post-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #555;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .post-type { font-size: 10px; padding: 3px 8px; border: 1px solid; }
        .post-type.free { color: #666; border-color: #333; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #c084fc; border-color: #c084fc; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; }
        
        .post-title { font-size: 18px; color: #ccc; }
        
        .post-body {
            padding: 20px 15px;
            font-size: 14px;
            color: #999;
            line-height: 1.8;
            word-break: break-word;
        }
        .post-body img { max-width: 100%; height: auto; margin: 10px 0; border: 1px solid #222; }
        .post-body pre {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            margin: 10px 0;
            overflow-x: auto;
            color: #2dd4bf;
            font-size: 13px;
        }
        .post-body code {
            background: #111;
            padding: 2px 6px;
            color: #2dd4bf;
            font-size: 13px;
        }
        .post-body pre code { background: none; padding: 0; }
        .post-body h1, .post-body h2, .post-body h3 { color: #D4743C; margin: 15px 0 10px 0; }
        .post-body h1 { font-size: 20px; }
        .post-body h2 { font-size: 18px; }
        .post-body h3 { font-size: 16px; }
        .post-body em { color: #c084fc; font-style: italic; }
        
        .post-actions {
            padding: 15px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #222;
            color: #555;
            padding: 8px 15px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { border-color: #444; color: #888; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .like-btn {
            border-color: #2dd4bf !important;
            color: #2dd4bf !important;
        }
        .like-btn:hover:not(:disabled) { background: rgba(45, 212, 191, 0.1) !important; }
        .like-count { font-size: 14px; color: #2dd4bf; }
        
        /* 댓글 */
        .comments-section {
            border: 1px solid #222;
            background: #0d0d0d;
        }
        .comments-header {
            padding: 12px 15px;
            font-size: 11px;
            border-bottom: 1px solid #1a1a1a;
            color: #555;
        }
        .comments-list { max-height: 500px; overflow-y: auto; }
        
        .comment-item {
            padding: 15px;
            border-bottom: 1px solid #111;
        }
        .comment-item:last-child { border-bottom: none; }
        
        .comment-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .comment-author { color: #D4743C; }
        .comment-date { color: #333; }
        .edited-mark { color: #444; font-size: 9px; }
        
        .comment-content { font-size: 13px; color: #888; line-height: 1.6; }
        .comment-content img { max-width: 100%; max-height: 200px; margin: 5px 0; border: 1px solid #222; }
        
        .comment-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }
        .comment-actions button {
            background: none;
            border: none;
            color: #333;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 6px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .comment-actions button:hover { color: #666; }
        
        .replies {
            margin-top: 10px;
            margin-left: 15px;
            padding-left: 12px;
            border-left: 1px solid #1a1a1a;
        }
        .reply-item { padding: 10px 0; }
        .reply-item .comment-author { color: #60a5fa; }
        
        .reply-form {
            margin-top: 10px;
            margin-left: 15px;
            padding: 10px;
            background: #0a0a0a;
            display: none;
        }
        .reply-form.active { display: block; }
        .reply-form-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .reply-form input {
            width: 80px;
            background: #111;
            border: 1px solid #222;
            color: #D4743C;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
        }
        .reply-form textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #999;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            resize: none;
            height: 50px;
            margin-bottom: 5px;
        }
        .reply-form button {
            background: #222;
            border: none;
            color: #D4743C;
            padding: 6px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
        }
        
        .comment-form {
            padding: 15px;
            border-top: 1px solid #1a1a1a;
        }
        .comment-form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-form input {
            background: #111;
            border: 1px solid #222;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            flex: 1;
        }
        .comment-form textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #999;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            resize: none;
            height: 60px;
            margin-bottom: 10px;
        }
        .comment-form button {
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
        }
        .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .no-comments {
            padding: 30px;
            text-align: center;
            color: #333;
            font-size: 11px;
        }
        
        .hint {
            font-size: 9px;
            color: #333;
            padding: 8px 15px;
            border-top: 1px dashed #1a1a1a;
        }
        
        .loading { text-align: center; padding: 50px; color: #444; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .blink { animation: blink 1s infinite; }
        
        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            border: 1px solid #D4743C;
            background: #0d0d0d;
            padding: 20px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h3 { font-size: 13px; margin-bottom: 15px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
            outline: none;
        }
        .modal-content textarea { color: #999; height: 100px; resize: none; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #D4743C;
            background: transparent;
            color: #D4743C;
        }
        .modal-buttons button.danger { background: #D4743C; color: #0a0a0a; }
        .modal-buttons button.primary { background: #60a5fa; border-color: #60a5fa; color: #0a0a0a; }
        
        @media (max-width: 600px) {
            .comment-form-row { flex-direction: column; }
            .replies { margin-left: 10px; padding-left: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FROST_COMMUNITY // POST</h1>
        </div>
        
        <a href="index.html" class="back-btn">← BACK</a>
        
        <div class="post-card">
            <div class="loading" id="loading">LOADING<span class="blink">_</span></div>
            <div id="postContent" style="display:none;">
                <div class="post-header">
                    <div class="post-meta">
                        <span class="post-type" id="postType"></span>
                        <span id="postAuthor"></span>
                        <span id="postDate"></span>
                    </div>
                    <h2 class="post-title" id="postTitle"></h2>
                </div>
                <div class="post-body" id="postBody"></div>
                <div class="post-actions">
                    <button class="btn like-btn" id="likeBtn" onclick="likePost()">♥ 추천</button>
                    <span class="like-count" id="likeCount">0</span>
                    <button class="btn" onclick="showDeleteModal()">삭제</button>
                </div>
            </div>
        </div>
        
        <!-- 댓글 섹션 -->
        <div class="comments-section" id="commentsSection" style="display:none;">
            <div class="comments-header">
                COMMENTS [ <span id="commentCount">0</span> ]
            </div>
            <div class="comments-list" id="commentsList">
                <div class="no-comments">아직 댓글이 없습니다.</div>
            </div>
            <div class="hint">마크다운: # 큰글씨 | *기울임* | ```코드``` | ![이미지](URL)</div>
            <form class="comment-form" id="commentForm">
                <div class="comment-form-row">
                    <input type="text" id="commentAuthor" placeholder="닉네임" maxlength="20" required>
                    <input type="password" id="commentPassword" placeholder="비밀번호" maxlength="20" required>
                </div>
                <textarea id="commentContent" placeholder="댓글을 입력하세요..." maxlength="500" required></textarea>
                <button type="submit" id="commentSubmitBtn">등록</button>
            </form>
        </div>
    </div>
    
    <!-- 글 삭제 모달 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>글 삭제</h3>
            <input type="password" id="deletePassword" placeholder="비밀번호">
            <div class="modal-buttons">
                <button onclick="closeModal('deleteModal')">취소</button>
                <button class="danger" onclick="deletePost()">삭제</button>
            </div>
        </div>
    </div>
    
    <!-- 댓글 수정 모달 -->
    <div class="modal" id="editCommentModal">
        <div class="modal-content">
            <h3>댓글 수정</h3>
            <input type="password" id="editCommentPassword" placeholder="비밀번호">
            <textarea id="editCommentContent" placeholder="수정할 내용"></textarea>
            <div class="modal-buttons">
                <button onclick="closeModal('editCommentModal')">취소</button>
                <button class="primary" onclick="editComment()">수정</button>
            </div>
        </div>
    </div>
    
    <!-- 댓글 삭제 모달 -->
    <div class="modal" id="deleteCommentModal">
        <div class="modal-content">
            <h3>댓글 삭제</h3>
            <input type="password" id="deleteCommentPassword" placeholder="비밀번호">
            <div class="modal-buttons">
                <button onclick="closeModal('deleteCommentModal')">취소</button>
                <button class="danger" onclick="deleteComment()">삭제</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        
        let currentPost = null;
        let isSubmittingComment = false;
        let editTarget = { commentId: null, replyId: null };
        let deleteTarget = { commentId: null, replyId: null };
        
        if (!postId) location.href = 'index.html';
        
        function parseMarkdown(text) {
            let parsed = escapeHtml(text);
            parsed = parsed.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            parsed = parsed.replace(/`([^`]+)`/g, '<code>$1</code>');
            parsed = parsed.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            parsed = parsed.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            parsed = parsed.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            parsed = parsed.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            parsed = parsed.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g, 
                '<img src="$2" alt="$1" onerror="this.style.display=\'none\'">');
            parsed = parsed.replace(/\n/g, '<br>');
            return parsed;
        }
        
        async function loadPost() {
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`);
                if (!response.ok) throw new Error('Post not found');
                
                const post = await response.json();
                currentPost = post;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('postContent').style.display = 'block';
                document.getElementById('commentsSection').style.display = 'block';
                
                const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
                const displayType = post.isNotice ? '공지' : (typeLabel[post.type] || post.type);
                const typeClass = post.isNotice ? 'notice' : post.type;
                
                document.getElementById('postType').textContent = displayType;
                document.getElementById('postType').className = `post-type ${typeClass}`;
                document.getElementById('postAuthor').innerHTML = formatAuthor(post.author);
                document.getElementById('postDate').textContent = formatDate(post.createdAt);
                document.getElementById('postTitle').textContent = post.title;
                document.getElementById('postBody').innerHTML = parseMarkdown(post.content);
                document.getElementById('likeCount').textContent = post.likes || 0;
                
                renderComments(post.comments || []);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'ERROR: 글을 찾을 수 없습니다.';
            }
        }
        
        async function likePost() {
            const btn = document.getElementById('likeBtn');
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`, { method: 'POST' });
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('likeCount').textContent = result.likes;
                    btn.textContent = '♥ 완료';
                } else {
                    alert(result.error || '추천 실패');
                    btn.disabled = false;
                }
            } catch (error) {
                alert('서버 연결 실패');
                btn.disabled = false;
            }
        }
        
        function countAllComments(comments) {
            return comments.reduce((sum, c) => sum + 1 + (c.replies?.length || 0), 0);
        }
        
        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            document.getElementById('commentCount').textContent = countAllComments(comments);
            
            if (comments.length === 0) {
                list.innerHTML = '<div class="no-comments">아직 댓글이 없습니다.</div>';
                return;
            }
            
            list.innerHTML = comments.map((c) => `
                <div class="comment-item" data-id="${c.id}">
                    <div class="comment-meta">
                        <span class="comment-author">${formatAuthor(c.author)}</span>
                        <span class="comment-date">${formatDate(c.createdAt)}</span>
                        ${c.editedAt ? '<span class="edited-mark">(수정됨)</span>' : ''}
                    </div>
                    <div class="comment-content">${parseMarkdown(c.content)}</div>
                    <div class="comment-actions">
                        <button onclick="toggleReplyForm('${c.id}')">답글</button>
                        <button onclick="showEditCommentModal('${c.id}', null, '${escapeAttr(c.content)}')">수정</button>
                        <button onclick="showDeleteCommentModal('${c.id}', null)">삭제</button>
                    </div>
                    
                    ${c.replies && c.replies.length > 0 ? `
                        <div class="replies">
                            ${c.replies.map((r) => `
                                <div class="reply-item">
                                    <div class="comment-meta">
                                        <span class="comment-author">↳ ${formatAuthor(r.author)}</span>
                                        <span class="comment-date">${formatDate(r.createdAt)}</span>
                                        ${r.editedAt ? '<span class="edited-mark">(수정됨)</span>' : ''}
                                    </div>
                                    <div class="comment-content">${parseMarkdown(r.content)}</div>
                                    <div class="comment-actions">
                                        <button onclick="showEditCommentModal('${c.id}', '${r.id}', '${escapeAttr(r.content)}')">수정</button>
                                        <button onclick="showDeleteCommentModal('${c.id}', '${r.id}')">삭제</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="reply-form" id="replyForm-${c.id}">
                        <div class="reply-form-row">
                            <input type="text" id="replyAuthor-${c.id}" placeholder="닉네임" maxlength="20">
                            <input type="password" id="replyPassword-${c.id}" placeholder="비밀번호" maxlength="20">
                        </div>
                        <textarea id="replyContent-${c.id}" placeholder="답글..." maxlength="300"></textarea>
                        <button onclick="submitReply('${c.id}')">등록</button>
                    </div>
                </div>
            `).join('');
        }
        
        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
        }
        
        function toggleReplyForm(commentId) {
            document.getElementById(`replyForm-${commentId}`).classList.toggle('active');
        }
        
        async function submitReply(parentCommentId) {
            const author = document.getElementById(`replyAuthor-${parentCommentId}`).value.trim();
            const password = document.getElementById(`replyPassword-${parentCommentId}`).value.trim();
            const content = document.getElementById(`replyContent-${parentCommentId}`).value.trim();
            
            if (!author || !password || !content) return alert('모든 필드를 입력해주세요.');
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, password, content, parentCommentId })
                });
                
                if (response.ok) {
                    document.getElementById(`replyContent-${parentCommentId}`).value = '';
                    document.getElementById(`replyForm-${parentCommentId}`).classList.remove('active');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '실패');
                }
            } catch (e) { alert('서버 오류'); }
        }
        
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmittingComment) return;
            isSubmittingComment = true;
            
            const btn = document.getElementById('commentSubmitBtn');
            btn.textContent = '등록 중...';
            btn.disabled = true;
            
            const author = document.getElementById('commentAuthor').value.trim();
            const password = document.getElementById('commentPassword').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            
            if (!author || !password || !content) {
                isSubmittingComment = false;
                btn.textContent = '등록';
                btn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, password, content })
                });
                
                if (response.ok) {
                    document.getElementById('commentContent').value = '';
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '실패');
                }
            } catch (e) { alert('서버 오류'); }
            finally {
                setTimeout(() => {
                    isSubmittingComment = false;
                    btn.textContent = '등록';
                    btn.disabled = false;
                }, 3000);
            }
        });
        
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function showEditCommentModal(commentId, replyId, content) {
            editTarget = { commentId, replyId };
            document.getElementById('editCommentContent').value = content.replace(/\\n/g, '\n');
            document.getElementById('editCommentModal').classList.add('active');
        }
        
        function showDeleteCommentModal(commentId, replyId) {
            deleteTarget = { commentId, replyId };
            document.getElementById('deleteCommentModal').classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        async function deletePost() {
            const password = document.getElementById('deletePassword').value;
            if (!password) return alert('비밀번호를 입력하세요.');
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (response.ok) {
                    alert('삭제되었습니다.');
                    location.href = 'index.html';
                } else {
                    const err = await response.json();
                    alert(err.error || '실패');
                }
            } catch (e) { alert('서버 오류'); }
        }
        
        async function editComment() {
            const password = document.getElementById('editCommentPassword').value;
            const newContent = document.getElementById('editCommentContent').value.trim();
            if (!password || !newContent) return alert('비밀번호와 내용을 입력하세요.');
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commentId: editTarget.commentId,
                        replyId: editTarget.replyId,
                        password,
                        newContent
                    })
                });
                
                if (response.ok) {
                    closeModal('editCommentModal');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '실패');
                }
            } catch (e) { alert('서버 오류'); }
        }
        
        async function deleteComment() {
            const password = document.getElementById('deleteCommentPassword').value;
            if (!password) return alert('비밀번호를 입력하세요.');
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commentId: deleteTarget.commentId,
                        replyId: deleteTarget.replyId,
                        password
                    })
                });
                
                if (response.ok) {
                    closeModal('deleteCommentModal');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '실패');
                }
            } catch (e) { alert('서버 오류'); }
        }
        
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `2076.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatAuthor(author) {
            if (author === '겁많은두더지') {
                return '<span style="background:#D4743C;color:#0a0a0a;padding:1px 5px;font-size:9px;margin-right:4px;">ADMIN</span>' + escapeHtml(author);
            }
            return escapeHtml(author);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('deleteModal');
                closeModal('editCommentModal');
                closeModal('deleteCommentModal');
            }
        });
        
        loadPost();
    </script>
</body>
</html>
