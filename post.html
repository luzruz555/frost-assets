<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // 글 보기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            border: 2px solid #D4743C;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 14px; font-weight: 500; }
        .header .path { color: #888; font-size: 12px; margin-top: 5px; }
        
        .back-btn {
            display: inline-block;
            color: #D4743C;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #333;
            font-size: 12px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: #D4743C; }
        
        .terminal {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            margin-bottom: 20px;
        }
        .terminal-header {
            background: #D4743C;
            color: #0a0a0a;
            padding: 8px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .terminal-body { padding: 20px; }
        
        .post-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }
        .post-meta span { font-size: 12px; color: #666; }
        .post-meta span strong { color: #888; }
        
        .post-type { font-size: 11px; padding: 3px 8px; border: 1px solid; }
        .post-type.free { color: #888; border-color: #888; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #f472b6; border-color: #f472b6; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; background: rgba(255, 215, 0, 0.1); }
        
        .post-title { font-size: 18px; color: #ccc; margin-bottom: 20px; }
        .post-content {
            font-size: 14px;
            color: #aaa;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-content img { max-width: 100%; height: auto; margin: 10px 0; border: 1px solid #333; }
        
        .post-actions {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }
        .post-actions button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 8px 15px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .post-actions button:hover { border-color: #D4743C; color: #D4743C; }
        
        /* 댓글 섹션 */
        .comments-section {
            border: 2px solid #333;
            background: #0d0d0d;
        }
        .comments-header {
            background: #1a1a1a;
            padding: 10px 15px;
            font-size: 12px;
            border-bottom: 1px solid #333;
        }
        .comments-list { max-height: 600px; overflow-y: auto; }
        
        .comment-item {
            padding: 15px;
            border-bottom: 1px solid #1a1a1a;
        }
        .comment-item:last-child { border-bottom: none; }
        
        .comment-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 11px;
            align-items: center;
            flex-wrap: wrap;
        }
        .comment-author { color: #D4743C; }
        .comment-date { color: #444; }
        .edited-mark { color: #666; font-size: 10px; }
        
        .comment-content { font-size: 13px; color: #999; line-height: 1.6; }
        .comment-content img { max-width: 100%; max-height: 300px; height: auto; margin: 5px 0; border: 1px solid #333; }
        
        .comment-actions {
            margin-top: 8px;
            display: flex;
            gap: 5px;
        }
        .comment-actions button {
            background: none;
            border: none;
            color: #555;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 6px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .comment-actions button:hover { color: #D4743C; }
        
        /* 대댓글 */
        .replies {
            margin-top: 10px;
            margin-left: 20px;
            padding-left: 15px;
            border-left: 2px solid #222;
        }
        .reply-item {
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .reply-item:last-child { border-bottom: none; }
        .reply-item .comment-author { color: #60a5fa; }
        
        /* 대댓글 폼 */
        .reply-form {
            margin-top: 10px;
            margin-left: 20px;
            padding: 10px;
            background: #111;
            display: none;
        }
        .reply-form.active { display: block; }
        .reply-form-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .reply-form input {
            width: 80px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
        }
        .reply-form textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            resize: none;
            height: 50px;
            margin-bottom: 5px;
        }
        .reply-form button {
            background: #333;
            border: none;
            color: #D4743C;
            padding: 6px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
        }
        .reply-form button:hover { background: #444; }
        
        .comment-form {
            padding: 15px;
            border-top: 1px solid #333;
        }
        .comment-form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .comment-form input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            outline: none;
            flex: 1;
        }
        .comment-form input:focus { border-color: #D4743C; }
        .comment-form textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            outline: none;
            resize: none;
            height: 60px;
            margin-bottom: 10px;
        }
        .comment-form textarea:focus { border-color: #D4743C; }
        .comment-form button {
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .comment-form button:hover:not(:disabled) { background: #e8854a; }
        .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .no-comments {
            padding: 30px;
            text-align: center;
            color: #444;
            font-size: 12px;
        }
        
        .image-hint {
            font-size: 10px;
            color: #444;
            padding: 5px 15px;
            border-top: 1px dashed #222;
        }
        
        .loading { text-align: center; padding: 50px; color: #666; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .blink { animation: blink 1s infinite; }
        
        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            padding: 20px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h3 { font-size: 14px; margin-bottom: 15px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 10px;
            outline: none;
        }
        .modal-content textarea {
            color: #ccc;
            height: 100px;
            resize: none;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #D4743C;
            background: transparent;
            color: #D4743C;
        }
        .modal-buttons button.danger { background: #D4743C; color: #0a0a0a; }
        .modal-buttons button.edit { background: #60a5fa; border-color: #60a5fa; color: #0a0a0a; }
        
        @media (max-width: 600px) {
            .comment-form-row { flex-direction: column; }
            .replies { margin-left: 10px; padding-left: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FROST_COMMUNITY v2.1.7 // POST_VIEWER</h1>
            <div class="path">C:\FROST\COMMUNITY\VIEW\</div>
        </div>
        
        <a href="index.html" class="back-btn">[ ← BACK_TO_LIST ]</a>
        
        <div class="terminal">
            <div class="terminal-header">
                <span>VIEW_POST.exe</span>
                <span id="postId"></span>
            </div>
            <div class="terminal-body">
                <div class="loading" id="loading">LOADING<span class="blink">_</span></div>
                <div id="postContent" style="display:none;">
                    <div class="post-meta">
                        <span class="post-type" id="postType"></span>
                        <span><strong>작성자:</strong> <span id="postAuthor"></span></span>
                        <span><strong>작성일:</strong> <span id="postDate"></span></span>
                    </div>
                    <h2 class="post-title" id="postTitle"></h2>
                    <div class="post-content" id="postBody"></div>
                    <div class="post-actions">
                        <button onclick="showDeleteModal()">[ DELETE ]</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 댓글 섹션 -->
        <div class="comments-section" id="commentsSection" style="display:none;">
            <div class="comments-header">
                COMMENTS [ <span id="commentCount">0</span> ]
            </div>
            <div class="comments-list" id="commentsList">
                <div class="no-comments">아직 댓글이 없습니다.</div>
            </div>
            <div class="image-hint">TIP: 이미지 첨부는 ![설명](이미지URL) 형식으로 입력</div>
            <form class="comment-form" id="commentForm">
                <div class="comment-form-row">
                    <input type="text" id="commentAuthor" placeholder="닉네임" maxlength="20" required>
                    <input type="password" id="commentPassword" placeholder="비밀번호" maxlength="20" required>
                </div>
                <textarea id="commentContent" placeholder="댓글을 입력하세요..." maxlength="500" required></textarea>
                <button type="submit" id="commentSubmitBtn">등록</button>
            </form>
        </div>
    </div>
    
    <!-- 글 삭제 모달 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>글 삭제</h3>
            <input type="password" id="deletePassword" placeholder="비밀번호 입력">
            <div class="modal-buttons">
                <button onclick="closeModal('deleteModal')">취소</button>
                <button class="danger" onclick="deletePost()">삭제</button>
            </div>
        </div>
    </div>
    
    <!-- 댓글 수정 모달 -->
    <div class="modal" id="editCommentModal">
        <div class="modal-content">
            <h3>댓글 수정</h3>
            <input type="password" id="editCommentPassword" placeholder="비밀번호 입력">
            <textarea id="editCommentContent" placeholder="수정할 내용"></textarea>
            <div class="modal-buttons">
                <button onclick="closeModal('editCommentModal')">취소</button>
                <button class="edit" onclick="editComment()">수정</button>
            </div>
        </div>
    </div>
    
    <!-- 댓글 삭제 모달 -->
    <div class="modal" id="deleteCommentModal">
        <div class="modal-content">
            <h3>댓글 삭제</h3>
            <input type="password" id="deleteCommentPassword" placeholder="비밀번호 입력">
            <div class="modal-buttons">
                <button onclick="closeModal('deleteCommentModal')">취소</button>
                <button class="danger" onclick="deleteComment()">삭제</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        
        let currentPost = null;
        let isSubmittingComment = false;
        let editTarget = { commentId: null, replyId: null, content: '' };
        let deleteTarget = { commentId: null, replyId: null };
        
        if (!postId) location.href = 'index.html';
        
        // 마크다운 이미지 변환
        function parseMarkdownImages(text) {
            let parsed = escapeHtml(text);
            return parsed.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g, 
                '<img src="$2" alt="$1" onerror="this.style.display=\'none\'">');
        }
        
        // 글 로드
        async function loadPost() {
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`);
                if (!response.ok) throw new Error('Post not found');
                
                const post = await response.json();
                currentPost = post;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('postContent').style.display = 'block';
                document.getElementById('commentsSection').style.display = 'block';
                
                const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
                const displayType = post.isNotice ? '공지' : (typeLabel[post.type] || post.type);
                const typeClass = post.isNotice ? 'notice' : post.type;
                
                document.getElementById('postId').textContent = `[${postId.substring(0, 15)}...]`;
                document.getElementById('postType').textContent = displayType;
                document.getElementById('postType').className = `post-type ${typeClass}`;
                document.getElementById('postAuthor').textContent = post.author;
                document.getElementById('postDate').textContent = formatDate(post.createdAt);
                document.getElementById('postTitle').textContent = post.title;
                document.getElementById('postBody').innerHTML = parseMarkdownImages(post.content);
                
                renderComments(post.comments || []);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'ERROR: 글을 찾을 수 없습니다.';
            }
        }
        
        // 총 댓글 수
        function countAllComments(comments) {
            return comments.reduce((sum, c) => sum + 1 + (c.replies?.length || 0), 0);
        }
        
        // 댓글 렌더링
        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            document.getElementById('commentCount').textContent = countAllComments(comments);
            
            if (comments.length === 0) {
                list.innerHTML = '<div class="no-comments">아직 댓글이 없습니다.</div>';
                return;
            }
            
            list.innerHTML = comments.map((c) => `
                <div class="comment-item" data-id="${c.id}">
                    <div class="comment-meta">
                        <span class="comment-author">${escapeHtml(c.author)}</span>
                        <span class="comment-date">${formatDate(c.createdAt)}</span>
                        ${c.editedAt ? '<span class="edited-mark">(수정됨)</span>' : ''}
                    </div>
                    <div class="comment-content">${parseMarkdownImages(c.content)}</div>
                    <div class="comment-actions">
                        <button onclick="toggleReplyForm('${c.id}')">답글</button>
                        <button onclick="showEditCommentModal('${c.id}', null, '${escapeAttr(c.content)}')">수정</button>
                        <button onclick="showDeleteCommentModal('${c.id}', null)">삭제</button>
                    </div>
                    
                    ${c.replies && c.replies.length > 0 ? `
                        <div class="replies">
                            ${c.replies.map((r) => `
                                <div class="reply-item">
                                    <div class="comment-meta">
                                        <span class="comment-author">↳ ${escapeHtml(r.author)}</span>
                                        <span class="comment-date">${formatDate(r.createdAt)}</span>
                                        ${r.editedAt ? '<span class="edited-mark">(수정됨)</span>' : ''}
                                    </div>
                                    <div class="comment-content">${parseMarkdownImages(r.content)}</div>
                                    <div class="comment-actions">
                                        <button onclick="showEditCommentModal('${c.id}', '${r.id}', '${escapeAttr(r.content)}')">수정</button>
                                        <button onclick="showDeleteCommentModal('${c.id}', '${r.id}')">삭제</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="reply-form" id="replyForm-${c.id}">
                        <div class="reply-form-row">
                            <input type="text" id="replyAuthor-${c.id}" placeholder="닉네임" maxlength="20">
                            <input type="password" id="replyPassword-${c.id}" placeholder="비밀번호" maxlength="20">
                        </div>
                        <textarea id="replyContent-${c.id}" placeholder="답글을 입력하세요..." maxlength="300"></textarea>
                        <button onclick="submitReply('${c.id}')">등록</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 속성용 이스케이프
        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
        }
        
        // 대댓글 폼 토글
        function toggleReplyForm(commentId) {
            const form = document.getElementById(`replyForm-${commentId}`);
            form.classList.toggle('active');
        }
        
        // 대댓글 제출
        async function submitReply(parentCommentId) {
            const author = document.getElementById(`replyAuthor-${parentCommentId}`).value.trim();
            const password = document.getElementById(`replyPassword-${parentCommentId}`).value.trim();
            const content = document.getElementById(`replyContent-${parentCommentId}`).value.trim();
            
            if (!author || !password || !content) {
                alert('모든 필드를 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, password, content, parentCommentId })
                });
                
                if (response.ok) {
                    document.getElementById(`replyContent-${parentCommentId}`).value = '';
                    document.getElementById(`replyForm-${parentCommentId}`).classList.remove('active');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '답글 작성 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 댓글 작성
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmittingComment) return;
            isSubmittingComment = true;
            
            const btn = document.getElementById('commentSubmitBtn');
            btn.textContent = '등록 중...';
            btn.disabled = true;
            
            const author = document.getElementById('commentAuthor').value.trim();
            const password = document.getElementById('commentPassword').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            
            if (!author || !password || !content) {
                isSubmittingComment = false;
                btn.textContent = '등록';
                btn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, password, content })
                });
                
                if (response.ok) {
                    document.getElementById('commentContent').value = '';
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '댓글 작성 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            } finally {
                setTimeout(() => {
                    isSubmittingComment = false;
                    btn.textContent = '등록';
                    btn.disabled = false;
                }, 3000);
            }
        });
        
        // 모달 관련
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
            document.getElementById('deletePassword').focus();
        }
        
        function showEditCommentModal(commentId, replyId, content) {
            editTarget = { commentId, replyId };
            document.getElementById('editCommentContent').value = content.replace(/\\n/g, '\n');
            document.getElementById('editCommentModal').classList.add('active');
            document.getElementById('editCommentPassword').focus();
        }
        
        function showDeleteCommentModal(commentId, replyId) {
            deleteTarget = { commentId, replyId };
            document.getElementById('deleteCommentModal').classList.add('active');
            document.getElementById('deleteCommentPassword').focus();
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        // 글 삭제
        async function deletePost() {
            const password = document.getElementById('deletePassword').value;
            if (!password) { alert('비밀번호를 입력하세요.'); return; }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (response.ok) {
                    alert('글이 삭제되었습니다.');
                    location.href = 'index.html';
                } else {
                    const err = await response.json();
                    alert(err.error || '삭제 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 댓글 수정
        async function editComment() {
            const password = document.getElementById('editCommentPassword').value;
            const newContent = document.getElementById('editCommentContent').value.trim();
            if (!password || !newContent) { alert('비밀번호와 내용을 입력하세요.'); return; }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commentId: editTarget.commentId,
                        replyId: editTarget.replyId,
                        password,
                        newContent
                    })
                });
                
                if (response.ok) {
                    alert('수정되었습니다.');
                    closeModal('editCommentModal');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '수정 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 댓글 삭제
        async function deleteComment() {
            const password = document.getElementById('deleteCommentPassword').value;
            if (!password) { alert('비밀번호를 입력하세요.'); return; }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commentId: deleteTarget.commentId,
                        replyId: deleteTarget.replyId,
                        password
                    })
                });
                
                if (response.ok) {
                    alert('삭제되었습니다.');
                    closeModal('deleteCommentModal');
                    loadPost();
                } else {
                    const err = await response.json();
                    alert(err.error || '삭제 실패');
                }
            } catch (error) {
                alert('서버 연결 실패');
            }
        }
        
        // 유틸리티
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `2076.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('deleteModal');
                closeModal('editCommentModal');
                closeModal('deleteCommentModal');
            }
        });
        
        loadPost();
    </script>
</body>
</html>
