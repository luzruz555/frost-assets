<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // 글 보기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            border: 2px solid #D4743C;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 14px;
            font-weight: 500;
        }
        
        .header .path {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .back-btn {
            display: inline-block;
            color: #D4743C;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #333;
            font-size: 12px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            border-color: #D4743C;
        }
        
        .terminal {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            margin-bottom: 20px;
        }
        
        .terminal-header {
            background: #D4743C;
            color: #0a0a0a;
            padding: 8px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        
        .terminal-body {
            padding: 20px;
        }
        
        .post-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }
        
        .post-meta span {
            font-size: 12px;
            color: #666;
        }
        
        .post-meta span strong {
            color: #888;
        }
        
        .post-type {
            font-size: 11px;
            padding: 3px 8px;
            border: 1px solid;
        }
        
        .post-type.free { color: #888; border-color: #888; }
        .post-type.info { color: #4ade80; border-color: #4ade80; }
        .post-type.trade { color: #60a5fa; border-color: #60a5fa; }
        .post-type.help { color: #f472b6; border-color: #f472b6; }
        .post-type.notice { color: #FFD700; border-color: #FFD700; background: rgba(255, 215, 0, 0.1); }
        
        .post-title {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        .post-content {
            font-size: 14px;
            color: #aaa;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        /* 마크다운 이미지 */
        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border: 1px solid #333;
        }
        
        .post-actions {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }
        
        .post-actions button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 8px 15px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .post-actions button:hover {
            border-color: #D4743C;
            color: #D4743C;
        }
        
        /* 댓글 섹션 */
        .comments-section {
            border: 2px solid #333;
            background: #0d0d0d;
        }
        
        .comments-header {
            background: #1a1a1a;
            padding: 10px 15px;
            font-size: 12px;
            border-bottom: 1px solid #333;
        }
        
        .comments-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .comment-item {
            padding: 15px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .comment-item:last-child {
            border-bottom: none;
        }
        
        .comment-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            font-size: 11px;
            align-items: center;
        }
        
        .comment-author {
            color: #D4743C;
        }
        
        .comment-date {
            color: #444;
        }
        
        .comment-content {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
        }
        
        /* 마크다운 이미지 (댓글) */
        .comment-content img {
            max-width: 100%;
            max-height: 300px;
            height: auto;
            margin: 5px 0;
            border: 1px solid #333;
        }
        
        .reply-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 8px;
            font-family: 'IBM Plex Mono', monospace;
        }
        
        .reply-btn:hover {
            color: #D4743C;
        }
        
        /* 대댓글 */
        .replies {
            margin-top: 10px;
            margin-left: 20px;
            padding-left: 15px;
            border-left: 2px solid #222;
        }
        
        .reply-item {
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .reply-item:last-child {
            border-bottom: none;
        }
        
        .reply-item .comment-author {
            color: #60a5fa;
        }
        
        /* 대댓글 폼 */
        .reply-form {
            margin-top: 10px;
            margin-left: 20px;
            padding: 10px;
            background: #111;
            display: none;
        }
        
        .reply-form.active {
            display: block;
        }
        
        .reply-form input {
            width: 80px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            margin-right: 5px;
        }
        
        .reply-form textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            outline: none;
            resize: none;
            height: 50px;
            margin: 5px 0;
        }
        
        .reply-form button {
            background: #333;
            border: none;
            color: #D4743C;
            padding: 6px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
        }
        
        .reply-form button:hover {
            background: #444;
        }
        
        .comment-form {
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        
        .comment-form input {
            width: 100px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            outline: none;
        }
        
        .comment-form input:focus {
            border-color: #D4743C;
        }
        
        .comment-form textarea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            outline: none;
            resize: none;
            height: 60px;
        }
        
        .comment-form textarea:focus {
            border-color: #D4743C;
        }
        
        .comment-form button {
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .comment-form button:hover:not(:disabled) {
            background: #e8854a;
        }
        
        .comment-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .no-comments {
            padding: 30px;
            text-align: center;
            color: #444;
            font-size: 12px;
        }
        
        .image-hint {
            font-size: 10px;
            color: #444;
            padding: 5px 15px;
            border-top: 1px dashed #222;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        /* 삭제 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            border: 2px solid #D4743C;
            background: #0d0d0d;
            padding: 30px;
            max-width: 350px;
        }
        
        .modal-content h3 {
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .modal-content input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #D4743C;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 15px;
            outline: none;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #D4743C;
            background: transparent;
            color: #D4743C;
        }
        
        .modal-buttons button.danger {
            background: #D4743C;
            color: #0a0a0a;
        }
        
        @media (max-width: 600px) {
            .comment-form {
                flex-direction: column;
            }
            .comment-form input {
                width: 100%;
            }
            .replies {
                margin-left: 10px;
                padding-left: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FROST_COMMUNITY v2.1.7 // POST_VIEWER</h1>
            <div class="path">C:\FROST\COMMUNITY\VIEW\</div>
        </div>
        
        <a href="index.html" class="back-btn">[ ← BACK_TO_LIST ]</a>
        
        <div class="terminal">
            <div class="terminal-header">
                <span>VIEW_POST.exe</span>
                <span id="postId"></span>
            </div>
            <div class="terminal-body">
                <div class="loading" id="loading">LOADING<span class="blink">_</span></div>
                <div id="postContent" style="display:none;">
                    <div class="post-meta">
                        <span class="post-type" id="postType"></span>
                        <span><strong>작성자:</strong> <span id="postAuthor"></span></span>
                        <span><strong>작성일:</strong> <span id="postDate"></span></span>
                    </div>
                    <h2 class="post-title" id="postTitle"></h2>
                    <div class="post-content" id="postBody"></div>
                    <div class="post-actions">
                        <button onclick="showDeleteModal()">[ DELETE ]</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 댓글 섹션 -->
        <div class="comments-section" id="commentsSection" style="display:none;">
            <div class="comments-header">
                COMMENTS [ <span id="commentCount">0</span> ]
            </div>
            <div class="comments-list" id="commentsList">
                <div class="no-comments">아직 댓글이 없습니다.</div>
            </div>
            <div class="image-hint">TIP: 이미지 첨부는 ![설명](이미지URL) 형식으로 입력</div>
            <form class="comment-form" id="commentForm">
                <input type="text" id="commentAuthor" placeholder="닉네임" maxlength="20" required>
                <textarea id="commentContent" placeholder="댓글을 입력하세요..." maxlength="500" required></textarea>
                <button type="submit" id="commentSubmitBtn">등록</button>
            </form>
        </div>
    </div>
    
    <!-- 삭제 모달 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>글 삭제</h3>
            <input type="password" id="deletePassword" placeholder="비밀번호 입력">
            <div class="modal-buttons">
                <button onclick="closeDeleteModal()">취소</button>
                <button class="danger" onclick="deletePost()">삭제</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frostc.pages.dev';
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        
        let currentPost = null;
        let isSubmittingComment = false;
        
        if (!postId) {
            location.href = 'index.html';
        }
        
        // 마크다운 이미지 변환
        function parseMarkdownImages(text) {
            // ![alt](url) 패턴을 <img>로 변환
            const imgRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
            let parsed = escapeHtml(text);
            
            // 이스케이프된 후 다시 이미지 태그로 변환
            parsed = parsed.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => {
                // 간단한 URL 검증 (http/https만 허용)
                if (url.match(/^https?:\/\/.+/i)) {
                    return `<img src="${url}" alt="${alt}" onerror="this.style.display='none'">`;
                }
                return match;
            });
            
            return parsed;
        }
        
        // 글 로드
        async function loadPost() {
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`);
                
                if (!response.ok) {
                    throw new Error('Post not found');
                }
                
                const post = await response.json();
                currentPost = post;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('postContent').style.display = 'block';
                document.getElementById('commentsSection').style.display = 'block';
                
                const typeLabel = { free: '자유', info: '정보', trade: '거래', help: '질문' };
                const displayType = post.isNotice ? '공지' : (typeLabel[post.type] || post.type);
                const typeClass = post.isNotice ? 'notice' : post.type;
                
                document.getElementById('postId').textContent = `[${postId.substring(0, 15)}...]`;
                document.getElementById('postType').textContent = displayType;
                document.getElementById('postType').className = `post-type ${typeClass}`;
                document.getElementById('postAuthor').textContent = post.author;
                document.getElementById('postDate').textContent = formatDate(post.createdAt);
                document.getElementById('postTitle').textContent = post.title;
                
                // 마크다운 이미지 파싱
                document.getElementById('postBody').innerHTML = parseMarkdownImages(post.content);
                
                // 댓글 표시
                renderComments(post.comments || []);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = 'ERROR: 글을 찾을 수 없습니다.';
            }
        }
        
        // 총 댓글 수 계산 (대댓글 포함)
        function countAllComments(comments) {
            let count = comments.length;
            comments.forEach(c => {
                if (c.replies) count += c.replies.length;
            });
            return count;
        }
        
        // 댓글 렌더링
        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            document.getElementById('commentCount').textContent = countAllComments(comments);
            
            if (comments.length === 0) {
                list.innerHTML = '<div class="no-comments">아직 댓글이 없습니다.</div>';
                return;
            }
            
            list.innerHTML = comments.map((c, i) => `
                <div class="comment-item" data-index="${i}">
                    <div class="comment-meta">
                        <span class="comment-author">${escapeHtml(c.author)}</span>
                        <span class="comment-date">${formatDate(c.createdAt)}</span>
                        <button class="reply-btn" onclick="toggleReplyForm(${i})">답글</button>
                    </div>
                    <div class="comment-content">${parseMarkdownImages(c.content)}</div>
                    
                    <!-- 대댓글 목록 -->
                    ${c.replies && c.replies.length > 0 ? `
                        <div class="replies">
                            ${c.replies.map(r => `
                                <div class="reply-item">
                                    <div class="comment-meta">
                                        <span class="comment-author">${escapeHtml(r.author)}</span>
                                        <span class="comment-date">${formatDate(r.createdAt)}</span>
                                    </div>
                                    <div class="comment-content">${parseMarkdownImages(r.content)}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <!-- 대댓글 폼 -->
                    <div class="reply-form" id="replyForm-${i}">
                        <input type="text" id="replyAuthor-${i}" placeholder="닉네임" maxlength="20">
                        <textarea id="replyContent-${i}" placeholder="답글을 입력하세요..." maxlength="300"></textarea>
                        <button onclick="submitReply(${i})">등록</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 대댓글 폼 토글
        function toggleReplyForm(index) {
            const form = document.getElementById(`replyForm-${index}`);
            form.classList.toggle('active');
            if (form.classList.contains('active')) {
                document.getElementById(`replyAuthor-${index}`).focus();
            }
        }
        
        // 대댓글 제출
        async function submitReply(commentIndex) {
            const author = document.getElementById(`replyAuthor-${commentIndex}`).value.trim();
            const content = document.getElementById(`replyContent-${commentIndex}`).value.trim();
            
            if (!author || !content) {
                alert('닉네임과 내용을 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        author, 
                        content,
                        parentIndex: commentIndex  // 부모 댓글 인덱스
                    })
                });
                
                if (response.ok) {
                    document.getElementById(`replyContent-${commentIndex}`).value = '';
                    document.getElementById(`replyForm-${commentIndex}`).classList.remove('active');
                    loadPost(); // 새로고침
                } else {
                    const err = await response.json();
                    alert(err.error || '답글 작성 실패');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결 실패');
            }
        }
        
        // 댓글 작성 (연타 방지)
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isSubmittingComment) return;
            isSubmittingComment = true;
            
            const btn = document.getElementById('commentSubmitBtn');
            const originalText = btn.textContent;
            btn.textContent = '등록 중...';
            btn.disabled = true;
            
            const author = document.getElementById('commentAuthor').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            
            if (!author || !content) {
                isSubmittingComment = false;
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, content })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('commentContent').value = '';
                    
                    if (result.comment && currentPost) {
                        if (!currentPost.comments) currentPost.comments = [];
                        currentPost.comments.push(result.comment);
                        renderComments(currentPost.comments);
                    } else {
                        loadPost();
                    }
                } else {
                    const err = await response.json();
                    alert(err.error || '댓글 작성 실패');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결 실패');
            } finally {
                setTimeout(() => {
                    isSubmittingComment = false;
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        });
        
        // 삭제 모달
        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
            document.getElementById('deletePassword').focus();
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            document.getElementById('deletePassword').value = '';
        }
        
        async function deletePost() {
            const password = document.getElementById('deletePassword').value;
            
            if (!password) {
                alert('비밀번호를 입력하세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (response.ok) {
                    alert('글이 삭제되었습니다.');
                    location.href = 'index.html';
                } else {
                    const err = await response.json();
                    alert(err.error || '삭제 실패');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결 실패');
            }
        }
        
        // 유틸리티 - 2076년으로 표시
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const year = 2076;
            return `${year}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ESC로 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDeleteModal();
        });
        
        // 초기 로드
        loadPost();
    </script>
</body>
</html>
