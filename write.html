<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROST_COMMUNITY // 글 작성</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #0a0a0a;
            color: #D4743C;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 700px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 16px; font-weight: 500; }
        
        .back-btn {
            display: inline-block;
            color: #555;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #222;
            font-size: 11px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: #444; color: #888; }
        
        .write-card {
            border: 1px solid #222;
            background: #0d0d0d;
        }
        .write-header {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 11px;
            color: #555;
        }
        .write-body { padding: 20px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            color: #555;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #D4743C;
            padding: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #333;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #333;
        }
        .form-group select { cursor: pointer; }
        .form-group select option { background: #111; }
        .form-group textarea {
            min-height: 180px;
            resize: vertical;
            color: #999;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        .char-count {
            text-align: right;
            font-size: 10px;
            color: #333;
            margin-top: 5px;
        }
        .char-count.warning { color: #ff6b6b; }
        
        .submit-btn {
            width: 100%;
            background: #D4743C;
            border: none;
            color: #0a0a0a;
            padding: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .submit-btn:hover:not(:disabled) { background: #e8854a; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .notice {
            margin-top: 15px;
            padding: 12px;
            border: 1px dashed #1a1a1a;
            font-size: 10px;
            color: #444;
            line-height: 1.7;
        }
        
        .hint {
            font-size: 9px;
            color: #333;
            padding: 10px 15px;
            border-top: 1px dashed #1a1a1a;
        }
        
        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            border: 1px solid #222;
            background: #0d0d0d;
            padding: 30px;
            max-width: 350px;
            text-align: center;
        }
        .modal-content.success { border-color: #2dd4bf; }
        .modal-content.success .modal-icon { color: #2dd4bf; }
        .modal-content.error { border-color: #ff6b6b; }
        .modal-content.error .modal-icon { color: #ff6b6b; }
        
        .modal-icon { font-size: 36px; margin-bottom: 15px; }
        .modal-message {
            font-size: 12px;
            margin-bottom: 20px;
            line-height: 1.7;
            color: #888;
            white-space: pre-line;
        }
        .modal-btn {
            background: transparent;
            border: 1px solid #222;
            color: #888;
            padding: 10px 30px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            cursor: pointer;
        }
        .modal-btn:hover { border-color: #444; color: #ccc; }
        
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .blink { animation: blink 1s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FROST_COMMUNITY // WRITE</h1>
        </div>
        
        <a href="index.html" class="back-btn">← BACK</a>
        
        <div class="write-card">
            <div class="write-header">NEW_POST</div>
            <div class="write-body">
                <form id="postForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>카테고리</label>
                            <select id="type" required>
                                <option value="">선택</option>
                                <option value="free">자유</option>
                                <option value="info">정보</option>
                                <option value="trade">거래</option>
                                <option value="help">질문</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>닉네임</label>
                            <input type="text" id="author" placeholder="닉네임" maxlength="20" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>제목</label>
                        <input type="text" id="title" placeholder="제목을 입력하세요" maxlength="50" required>
                        <div class="char-count"><span id="titleCount">0</span>/50</div>
                    </div>
                    
                    <div class="form-group">
                        <label>내용</label>
                        <textarea id="content" placeholder="내용을 입력하세요..." maxlength="2000" required></textarea>
                        <div class="char-count"><span id="contentCount">0</span>/2000</div>
                    </div>
                    
                    <div class="form-group">
                        <label>비밀번호 (삭제용)</label>
                        <input type="password" id="password" placeholder="비밀번호" maxlength="20" required>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">작성하기</button>
                </form>
                
                <div class="notice">
                    · 작성된 글은 관리자 승인 후 게시됩니다<br>
                    · 비밀번호는 글 삭제 시 필요합니다
                </div>
            </div>
            <div class="hint">마크다운: # 큰글씨 | *기울임* | ```코드``` | ![이미지](URL)</div>
        </div>
    </div>
    
    <!-- 결과 모달 -->
    <div class="modal" id="resultModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://frost-community-bot.onrender.com';
        
        let isSubmitting = false;
        let shouldRedirect = false;
        
        // 글자 수 카운터
        document.getElementById('title').addEventListener('input', function() {
            const count = this.value.length;
            const counter = document.getElementById('titleCount');
            counter.textContent = count;
            counter.parentElement.classList.toggle('warning', count > 45);
        });
        
        document.getElementById('content').addEventListener('input', function() {
            const count = this.value.length;
            const counter = document.getElementById('contentCount');
            counter.textContent = count;
            counter.parentElement.classList.toggle('warning', count > 1800);
        });
        
        // 폼 제출
        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (isSubmitting) return;
            isSubmitting = true;
            
            const btn = document.getElementById('submitBtn');
            btn.textContent = '전송 중...';
            btn.disabled = true;
            
            const formData = {
                type: document.getElementById('type').value,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                content: document.getElementById('content').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch(`${API_URL}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    shouldRedirect = true;
                    showModal('success', '✓', result.message || '글이 제출되었습니다.\n관리자 승인을 기다려주세요.');
                    this.reset();
                    document.getElementById('titleCount').textContent = '0';
                    document.getElementById('contentCount').textContent = '0';
                } else {
                    showModal('error', '✕', result.error || '오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                showModal('error', '✕', '서버 연결에 실패했습니다.\n잠시 후 다시 시도해주세요.');
            } finally {
                btn.textContent = '작성하기';
                btn.disabled = false;
                isSubmitting = false;
            }
        });
        
        function showModal(type, icon, message) {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            const iconEl = document.getElementById('modalIcon');
            const messageEl = document.getElementById('modalMessage');
            
            content.className = 'modal-content ' + type;
            iconEl.textContent = icon;
            messageEl.textContent = message;
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
            if (shouldRedirect) {
                shouldRedirect = false;
                location.href = 'index.html';
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
